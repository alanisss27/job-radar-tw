name: Read-only daily claim diagnostic

on:
  workflow_dispatch:
    inputs:
      run_key:
        description: "Daily key to inspect (daily-YYYY-MM-DD)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - run: uv sync --frozen
      - name: Inspect persisted claim (read-only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INPUT_RUN_KEY: ${{ inputs.run_key }}
        run: uv run --no-sync python -m job_monitor.claim_diagnostic --run-key "$INPUT_RUN_KEY"
