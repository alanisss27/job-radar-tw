name: Temporary pytest baseline diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  compare:
    if: github.head_ref == 'phase1-phase2-readiness' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout origin/main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: baseline
          persist-credentials: false
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: feature
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Compare isolated full pytest runs
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          RUNNER_IMAGE_OS: ${{ runner.os }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import shutil
          import subprocess
          import sys
          import textwrap

          root = Path(os.environ["RUNNER_TEMP"]) / "pytest-baseline-diagnostic"
          root.mkdir()
          artifacts = Path(os.environ["RUNNER_TEMP"]) / "pytest-baseline-artifacts"
          artifacts.mkdir()
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          uv = shutil.which("uv")
          ip = shutil.which("ip")
          if not uv or not ip or not shutil.which("unshare"):
              raise SystemExit("Infrastructure failure: uv, ip and unshare are required")
          subprocess.run(["sudo", "-n", "true"], check=True)
          host_net = os.readlink("/proc/self/ns/net")

          plugin = root / "baseline_plugin.py"
          plugin.write_text(textwrap.dedent('''\
          import importlib.metadata
          import json
          import os
          from pathlib import Path
          import platform
          import sys

          collected = []
          reports = []
          collection_errors = []
          internal_errors = []

          def pytest_collection_finish(session):
              collected.extend(item.nodeid for item in session.items)

          def pytest_collectreport(report):
              if report.failed:
                  collection_errors.append({"nodeid": report.nodeid, "details": str(report.longrepr)})

          def pytest_internalerror(excrepr, excinfo):
              internal_errors.append(str(excrepr))

          def pytest_runtest_logreport(report):
              reports.append({"nodeid": report.nodeid, "phase": report.when,
                              "outcome": report.outcome})

          def pytest_sessionfinish(session, exitstatus):
              import job_monitor
              source = Path(job_monitor.__file__).resolve()
              expected = Path.cwd() / "src"
              data = {
                  "exit_code": int(exitstatus), "collected": collected,
                  "failed": sorted({r["nodeid"] for r in reports if r["outcome"] == "failed"}),
                  "reports": reports, "collection_errors": collection_errors,
                  "internal_errors": internal_errors,
                  "python": sys.version, "platform": platform.platform(),
                  "source_path": str(source), "correct_source": source.is_relative_to(expected),
                  "packages": sorted((d.metadata["Name"].lower(), d.version)
                                     for d in importlib.metadata.distributions()),
              }
              Path(os.environ["DIAGNOSTIC_RESULT"]).write_text(json.dumps(data, indent=2))
          '''))

          # This guard supplements OS network isolation with a storage boundary.
          (root / "sitecustomize.py").write_text(textwrap.dedent('''\
          import os
          from pathlib import Path
          import sys

          storage = Path(os.environ["DIAGNOSTIC_STORAGE"]).resolve()

          def audit(event, args):
              if event == "sqlite3.connect":
                  database = str(args[0])
                  if database == ":memory:" or database.startswith("file:") and "mode=memory" in database:
                      return
                  if not Path(database).resolve().is_relative_to(storage):
                      raise RuntimeError("Diagnostic blocked SQLite outside isolated storage")

          sys.addaudithook(audit)
          '''))

          runner = root / "run_isolated.py"
          runner.write_text(textwrap.dedent('''\
          import ctypes
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          config = json.loads(Path(sys.argv[1]).read_text())
          if os.readlink("/proc/self/ns/net") == config["host_net"]:
              raise SystemExit("Infrastructure failure: network namespace unchanged")
          subprocess.run([config["ip"], "link", "set", "lo", "up"], check=True)
          interfaces = json.loads(subprocess.check_output([config["ip"], "-j", "link", "show"]))
          if {item["ifname"] for item in interfaces} != {"lo"}:
              raise SystemExit("Infrastructure failure: external network interface present")
          # Drop root and prohibit privilege recovery before executing test code.
          if ctypes.CDLL(None, use_errno=True).prctl(38, 1, 0, 0, 0) != 0:
              raise SystemExit("Infrastructure failure: cannot set no_new_privs")
          os.setgroups([])
          os.setgid(config["gid"])
          os.setuid(config["uid"])
          os.chdir(config["checkout"])
          with open(config["log"], "w") as log:
              result = subprocess.run(["uv", "run", "pytest", "-q"],
                                      env=config["env"], stdout=log, stderr=subprocess.STDOUT)
          Path(config["exit_file"]).write_text(str(result.returncode))
          '''))

          errors = []
          results = {}
          for name in ("baseline", "feature"):
              checkout = workspace / name
              storage = root / (name + "-storage")
              storage.mkdir()
              (storage / "home").mkdir()
              metadata = {"command": "uv run pytest -q", "network": "loopback only",
                          "runner_image": {k: os.environ.get(k) for k in
                                           ("ImageOS", "ImageVersion", "RUNNER_IMAGE_OS")},
                          "host_platform": platform.platform(), "host_python": sys.version}
              try:
                  sha = subprocess.check_output(["git", "rev-parse", "HEAD"], cwd=checkout, text=True).strip()
                  metadata["sha"] = sha
                  if name == "feature" and sha != os.environ["EXPECTED_HEAD"]:
                      raise RuntimeError("Feature checkout is not the exact PR head")
                  for filename in ("uv.lock", "pyproject.toml"):
                      metadata[filename + "_sha256"] = hashlib.sha256((checkout / filename).read_bytes()).hexdigest()
                  if (checkout / ".env").exists():
                      raise RuntimeError("Unexpected tracked .env file")
                  # These are the existing CI dependency commands, unchanged.
                  with (artifacts / (name + "-setup.log")).open("w") as log:
                      for command in ([uv, "lock", "--check"], [uv, "sync", "--frozen", "--extra", "dev"]):
                          subprocess.run(command, cwd=checkout, check=True, stdout=log, stderr=subprocess.STDOUT)
                  metadata["uv"] = subprocess.check_output([uv, "--version"], text=True).strip()
                  result_path = artifacts / (name + "-result.json")
                  # Allowlist: no GitHub token, production credentials or personal configuration.
                  env = {
                      "PATH": os.environ["PATH"], "HOME": str(storage / "home"),
                      "LANG": "C.UTF-8", "TZ": "UTC", "CI": "true",
                      "UV_OFFLINE": "1", "UV_NO_SYNC": "1",
                      "UV_PROJECT_ENVIRONMENT": str(checkout / ".venv"),
                      "UV_CACHE_DIR": str(storage / "uv-cache"),
                      "PYTHONPATH": str(root), "PYTHONNOUSERSITE": "1",
                      "PYTHONDONTWRITEBYTECODE": "1", "PYTEST_PLUGINS": "baseline_plugin",
                      "PYTEST_DEBUG_TEMPROOT": str(storage),
                      "TMPDIR": str(storage), "TMP": str(storage), "TEMP": str(storage),
                      "DIAGNOSTIC_STORAGE": str(storage), "DIAGNOSTIC_RESULT": str(result_path),
                  }
                  config = {"host_net": host_net, "ip": ip, "uid": os.getuid(), "gid": os.getgid(),
                            "checkout": str(checkout), "env": env,
                            "log": str(artifacts / (name + "-pytest.log")),
                            "exit_file": str(artifacts / (name + "-exit-code.txt"))}
                  config_path = root / (name + "-config.json")
                  config_path.write_text(json.dumps(config))
                  subprocess.run(["sudo", "-n", "unshare", "--net", "--", "env", "-i",
                                  "PATH=" + os.environ["PATH"], sys.executable, str(runner),
                                  str(config_path)], check=True, timeout=600)
                  data = json.loads(result_path.read_text())
                  process_exit = int(Path(config["exit_file"]).read_text())
                  metadata["process_exit_code"] = process_exit
                  if (process_exit not in (0, 1) or data["exit_code"] != process_exit
                          or data["collection_errors"] or data["internal_errors"]
                          or not data["collected"] or not data["correct_source"]
                          or bool(data["failed"]) != (process_exit == 1)):
                      raise RuntimeError("Infrastructure/collection error: inspect result and pytest log")
                  results[name] = data
              except Exception as exc:
                  errors.append(name + ": " + str(exc))
              finally:
                  (artifacts / (name + "-environment.json")).write_text(json.dumps(metadata, indent=2))

          comparison = {"infrastructure_errors": errors, "baseline_parity": False}
          if len(results) == 2:
              baseline, feature = results["baseline"], results["feature"]
              for key in ("python", "platform", "packages"):
                  if baseline[key] != feature[key]:
                      errors.append("Environment mismatch: " + key)
              for filename in ("uv.lock", "pyproject.toml"):
                  digest = filename + "_sha256"
                  left = json.loads((artifacts / "baseline-environment.json").read_text())
                  right = json.loads((artifacts / "feature-environment.json").read_text())
                  if left[digest] != right[digest]:
                      errors.append("Dependency input mismatch: " + filename)
              old, new = set(baseline["failed"]), set(feature["failed"])
              comparison.update({
                  "shared_failures": sorted(old & new), "main_only_failures": sorted(old - new),
                  "feature_only_failures": sorted(new - old),
                  "feature_added_failures": sorted((new - old) - set(baseline["collected"])),
                  "main_only_collected": sorted(set(baseline["collected"]) - set(feature["collected"])),
                  "feature_only_collected": sorted(set(feature["collected"]) - set(baseline["collected"])),
                  "collected_counts": {k: len(v["collected"]) for k, v in results.items()},
                  "failed_counts": {k: len(v["failed"]) for k, v in results.items()},
                  "baseline_parity": not errors and old == new,
              })
          (artifacts / "comparison.json").write_text(json.dumps(comparison, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Offline Ubuntu pytest comparison\n\n")
              summary.write("Download artifacts for exact SHAs, node IDs, logs and environment metadata.\n\n")
              summary.write("```json\n" + json.dumps({k: v for k, v in comparison.items()
                            if not isinstance(v, list) or k == "infrastructure_errors"}, indent=2) + "\n```\n")
              summary.write("\nExternal HTTP was blocked; this does not reproduce live endpoint responses. "
                            "Existing CI checks are unchanged.\n")
          if errors:
              raise SystemExit("Infrastructure/collection failure: " + "; ".join(errors))
          if comparison["feature_only_failures"]:
              raise SystemExit("Feature-only failing node IDs found; inspect comparison.json")
          PY
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-baseline-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/pytest-baseline-artifacts/
          retention-days: 7
          if-no-files-found: warn
