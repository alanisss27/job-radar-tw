name: Temporary PostgreSQL read-only preflight

on:
  workflow_dispatch:
    inputs:
      diagnostic_mode:
        description: Preflight diagnostic
        type: choice
        required: true
        default: catalog
        options:
          - catalog
          - ca_compare

permissions:
  contents: read

jobs:
  inspect:
    if: github.ref == 'refs/heads/main' && github.ref_protected
    environment: db-readonly-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /pyproject.toml
            /uv.lock
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false
      - run: uv sync --frozen --no-dev --no-install-project --no-build
      - name: Inspect PostgreSQL catalogs (read only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROJECT_FINGERPRINT: ${{ secrets.SUPABASE_PROJECT_FINGERPRINT }}
          DIAGNOSTIC_MODE: ${{ inputs.diagnostic_mode }}
          PROJECT_CA_PEM_B64: >-
            ${{ inputs.diagnostic_mode == 'ca_compare' && secrets.SUPABASE_PROJECT_CA_PEM_B64 || '' }}
        run: |
          .venv/bin/python -I -S - 2>/dev/null <<'PY'
          import base64
          import errno
          import hashlib
          import hmac
          import json
          import logging
          import os
          import re
          import signal
          import socket
          import ssl
          import subprocess
          import sys
          import tempfile
          import time
          from pathlib import Path

          logging.disable(logging.CRITICAL)

          def classify_connection_line(line):
              if re.fullmatch(r"failed to resolve host '[^']+': .+", line):
                  return "network_unreachable"
              match = re.fullmatch(r"connection to server at .+? failed: (.+)", line)
              reason = match[1] if match else line
              if reason == "connection timeout expired":
                  return "connect_timeout"
              if not match:
                  return None
              if re.fullmatch(r"SSL error: certificate verify failed(?:: .+)?", reason):
                  return "tls_verification_failed"
              if re.fullmatch(
                  r'server certificate for "[^"]+"(?: \(and [0-9]+ other names?\))?'
                  r' does not match host name "[^"]+"',
                  reason,
              ):
                  return "tls_verification_failed"
              if re.fullmatch(r'FATAL:[ \t]+password authentication failed for user "[^"]+"', reason):
                  return "authentication_failed"
              return {
                  "Network is unreachable": "network_unreachable",
                  "No route to host": "network_unreachable",
                  "timeout expired": "connect_timeout",
                  "Connection timed out": "connect_timeout",
              }.get(reason)

          def classify_connection_error(error):
              unknown = "unknown_connection_error"
              if isinstance(error, psycopg.OperationalError):
                  lines = str(error).splitlines()
                  summary = "Multiple connection attempts failed. All failures were:"
                  if summary in lines:
                      # The exception type and SQLSTATE can describe only the last attempt.
                      start = lines.index(summary)
                      attempts = lines[start + 1:]
                      if start == 0 or len(attempts) < 2:
                          return unknown
                      pattern = r"- host: '[^']+', port: (?:'[0-9]+'|None), hostaddr: '[^']+': (.+)"
                      for index, line in enumerate(attempts):
                          match = re.fullmatch(pattern, line)
                          if not match:
                              return unknown
                          attempts[index] = match[1]
                      categories = {classify_connection_line(line) for line in lines[:start] + attempts}
                      return categories.pop() if len(categories) == 1 and None not in categories else unknown
              if isinstance(error, ssl.SSLCertVerificationError):
                  return "tls_verification_failed"
              if isinstance(error, TimeoutError | psycopg.errors.ConnectionTimeout):
                  return "connect_timeout"
              if isinstance(error, socket.gaierror) or (
                  isinstance(error, OSError)
                  and error.errno in {errno.ENETUNREACH, errno.EHOSTUNREACH}
              ):
                  return "network_unreachable"
              if isinstance(error, psycopg.Error) and error.sqlstate in {"28000", "28P01"}:
                  return "authentication_failed"
              if isinstance(error, psycopg.OperationalError):
                  categories = {classify_connection_line(line) for line in lines}
                  if len(categories) == 1 and None not in categories:
                      return categories.pop()
              return unknown

          def validate_project_ca(encoded):
              if not encoded or len(encoded) > 24_000:
                  raise ValueError()
              pem = base64.b64decode(encoded, validate=True)
              if not re.fullmatch(
                  rb"-----BEGIN CERTIFICATE-----\r?\n"
                  rb"(?:[A-Za-z0-9+/=]+\r?\n)+-----END CERTIFICATE-----(?:\r?\n)?",
                  pem,
              ):
                  raise ValueError()
              der = base64.b64decode(b"".join(pem.splitlines()[1:-1]), validate=True)
              command = ["openssl", "x509", "-inform", "DER"]
              metadata = subprocess.run(
                  [*command, "-noout", "-dates", "-ext", "basicConstraints"],
                  input=der, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,
                  check=True, timeout=5,
              ).stdout.decode("ascii")
              before = re.search(r"^notBefore=(.+)$", metadata, re.MULTILINE)
              after = re.search(r"^notAfter=(.+)$", metadata, re.MULTILINE)
              now = time.time()
              if (
                  not before or not after
                  or not re.search(r"^[ \t]+CA:TRUE(?:,.*)?$", metadata, re.MULTILINE)
                  or not ssl.cert_time_to_seconds(before[1]) <= now < ssl.cert_time_to_seconds(after[1])
              ):
                  raise ValueError()
              # OpenSSL can parse the first certificate of a stream. Reject trailing DER.
              canonical = subprocess.run(
                  [*command, "-outform", "DER"], input=der,
                  stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, check=True, timeout=5,
              ).stdout
              if canonical != der:
                  raise ValueError()
              return pem

          def compare_connection(params, trust_source, outcomes):
              outcome = outcomes[trust_source]
              try:
                  connection = psycopg.connect(**params, autocommit=True, prepare_threshold=None)
              except Exception as error:
                  outcome.update(status="connection_failed", connection_error=classify_connection_error(error))
                  return True
              try:
                  connection.close()
              except Exception:
                  outcome["status"] = "cleanup_failed"
                  return False
              outcome["status"] = "connected"
              return True

          def compare_ca(params, pem, outcomes):
              # Resolve once and preserve the original host for verify-full. One
              # numeric hostaddr prevents psycopg from retrying other DNS results.
              try:
                  addresses = socket.getaddrinfo(
                      params["host"], params["port"], type=socket.SOCK_STREAM, proto=socket.IPPROTO_TCP,
                  )
              except OSError:
                  return "ca_resolution_failed"
              if not addresses:
                  return "ca_resolution_failed"
              with tempfile.TemporaryDirectory(dir=os.environ["RUNNER_TEMP"], prefix="preflight-ca-") as directory:
                  with tempfile.NamedTemporaryFile(dir=directory, suffix=".pem", delete=False) as certificate:
                      certificate.write(pem)
                  common = dict(params, hostaddr=addresses[0][4][0], target_session_attrs="any")
                  for mode, root in (("system", "system"), ("project", certificate.name)):
                      if not compare_connection(dict(common, sslrootcert=root), mode, outcomes):
                          return "cleanup_failed"
              if all(outcome["status"] == "connected" for outcome in outcomes.values()):
                  return "ca_comparison_complete"
              return "ca_comparison_failed"

          def stop_on_termination(_signum, _frame):
              raise SystemExit(1)

          def finish(result, phase):
              result["policy_review_status"] = phase
              print(json.dumps(result, sort_keys=True))
              raise SystemExit(0 if phase in {"complete", "ca_comparison_complete"} else 1)

          result = {
              "connection_ok": False,
              "connection_error": None,
              "endpoint_type": "unknown",
              "libpq_version": None,
              "transaction_read_only": "unknown",
              "project_match": "unknown",
              "table_exists": "unknown",
              "schema_matches": "unknown",
              "rls_enabled": "unknown",
              "rls_active_for_effective_role": "unknown",
              "select_granted": "unknown",
              "insert_granted": "unknown",
              "update_granted": "unknown",
              "policy_review_status": "invalid_fingerprint",
          }
          expected = os.environ.pop("PROJECT_FINGERPRINT", "")
          url = os.environ.pop("DATABASE_URL", "")
          ca_encoded = os.environ.pop("PROJECT_CA_PEM_B64", "")
          mode = os.environ.pop("DIAGNOSTIC_MODE", "catalog")
          phase = "invalid_diagnostic_mode"
          try:
              if mode not in {"catalog", "ca_compare"}:
                  raise ValueError()
              phase = "invalid_fingerprint"
              if mode == "ca_compare":
                  result["ca_comparison"] = {
                      name: {"status": "not_attempted", "connection_error": None}
                      for name in ("system", "project")
                  }
              if not re.fullmatch(r"[a-f0-9]{64}", expected):
                  raise ValueError()
              phase = "invalid_endpoint"
              # Import the locked driver without processing site startup hooks.
              sys.path.append(str(Path(".venv/lib/python3.12/site-packages").resolve()))
              import psycopg
              from psycopg.conninfo import conninfo_to_dict

              url = url.replace("postgresql+psycopg://", "postgresql://", 1)
              if not url.startswith(("postgresql://", "postgres://")):
                  raise ValueError()
              params = conninfo_to_dict(url)
              # Reject alternate routing, session options and TLS overrides.
              allowed = {"host", "port", "dbname", "user", "password", "sslmode"}
              if params.keys() - allowed or not all(
                  params.get(key) for key in ("host", "dbname", "user", "password")
              ):
                  raise ValueError()
              host = params["host"].lower()
              port = params.get("port", "5432")
              if port not in {"5432", "6543"}:
                  raise ValueError()
              # Direct and dedicated pooler hosts carry the project reference.
              # Shared session and transaction poolers carry it in the login role.
              project = re.fullmatch(r"db\.([a-z0-9]{20})\.supabase\.co", host)
              if project:
                  endpoint_type = "direct" if port == "5432" else "dedicated_transaction_pooler"
              elif re.fullmatch(
                  r"aws-[0-9]+-[a-z0-9]+(?:-[a-z0-9]+)*\.pooler\.supabase\.com", host
              ):
                  project = re.fullmatch(r"[^.]+\.([a-z0-9]{20})", params["user"])
                  endpoint_type = (
                      "shared_session_pooler" if port == "5432" else "shared_transaction_pooler"
                  )
              if not project:
                  raise ValueError()
              actual = hashlib.sha256(project[1].encode("ascii")).hexdigest()
              result["project_match"] = hmac.compare_digest(actual, expected)
              if not result["project_match"]:
                  phase = "project_mismatch"
                  raise ValueError()
              result["endpoint_type"] = endpoint_type
              result["libpq_version"] = psycopg.pq.version()
              params.update(
                  host=host, port=port, sslmode="verify-full", sslrootcert="system",
                  gssencmode="disable", connect_timeout=5,
              )
              if mode == "ca_compare":
                  phase = "invalid_project_ca"
                  pem = validate_project_ca(ca_encoded)
                  phase = "ca_setup_or_cleanup_failed"
                  signal.signal(signal.SIGTERM, stop_on_termination)
                  phase = compare_ca(params, pem, result["ca_comparison"])
                  finish(result, phase)
              phase = "connection_failed"
              try:
                  connection = psycopg.connect(**params, autocommit=True, prepare_threshold=None)
              except Exception as error:
                  result["connection_error"] = classify_connection_error(error)
                  raise
              with connection as conn:
                  result["connection_ok"] = True
                  phase = "readonly_check_failed"
                  conn.execute("BEGIN READ ONLY")
                  try:
                      conn.execute("SET LOCAL statement_timeout = '3s'")
                      conn.execute("SET LOCAL lock_timeout = '1s'")
                      readonly = conn.execute("SHOW transaction_read_only").fetchone()[0] == "on"
                      result["transaction_read_only"] = readonly
                      if not readonly:
                          raise RuntimeError()
                      phase = "catalog_check_failed"
                      row = conn.execute("""
                          SELECT c.relkind = 'r'
                              AND to_regclass('workday_host_cooldowns') = c.oid
                              AND h.atttypid = 'varchar'::regtype AND h.atttypmod = 257
                              AND h.attnotnull AND h.attgenerated = ''
                              AND d.atttypid = 'float8'::regtype AND d.attnotnull
                              AND d.attgenerated = ''
                              AND (SELECT count(*) FROM pg_attribute a
                                   WHERE a.attrelid = c.oid AND a.attnum > 0
                                     AND NOT a.attisdropped) = 2
                              AND EXISTS (
                                  SELECT 1 FROM pg_constraint p
                                  JOIN pg_index i ON i.indexrelid = p.conindid
                                  WHERE p.conrelid = c.oid AND p.contype = 'p'
                                    AND p.conkey = ARRAY[h.attnum]
                                    AND p.convalidated AND NOT p.condeferrable
                                    AND i.indisvalid AND i.indisready
                              ),
                              c.relrowsecurity, row_security_active(c.oid),
                              has_schema_privilege(n.oid, 'USAGE')
                                AND has_column_privilege(c.oid, h.attnum, 'SELECT')
                                AND has_column_privilege(c.oid, d.attnum, 'SELECT'),
                              has_schema_privilege(n.oid, 'USAGE')
                                AND has_column_privilege(c.oid, h.attnum, 'INSERT')
                                AND has_column_privilege(c.oid, d.attnum, 'INSERT'),
                              has_schema_privilege(n.oid, 'USAGE')
                                AND has_column_privilege(c.oid, d.attnum, 'UPDATE'),
                              EXISTS (SELECT 1 FROM pg_policy p WHERE p.polrelid = c.oid)
                          FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                          LEFT JOIN pg_attribute h ON h.attrelid = c.oid AND h.attname = 'host'
                            AND h.attnum > 0 AND NOT h.attisdropped
                          LEFT JOIN pg_attribute d ON d.attrelid = c.oid
                            AND d.attname = 'cooldown_until_epoch'
                            AND d.attnum > 0 AND NOT d.attisdropped
                          WHERE n.nspname = 'public' AND c.relname = 'workday_host_cooldowns'
                          """).fetchone()
                      result["table_exists"] = row is not None
                      keys = ("schema_matches", "rls_enabled", "rls_active_for_effective_role",
                              "select_granted", "insert_granted", "update_granted")
                      if row is None:
                          result.update(dict.fromkeys(keys, "not_applicable"))
                          result["policy_review_status"] = "not_applicable"
                      else:
                          result.update(zip(keys, map(bool, row[:6]), strict=True))
                          if not row[1]:
                              policy = "rls_disabled"
                          elif not row[2]:
                              policy = "rls_not_active_for_role"
                          elif row[6]:
                              policy = "review_required"
                          else:
                              policy = "default_deny"
                          result["policy_review_status"] = policy
                  finally:
                      try:
                          conn.execute("ROLLBACK")
                      except Exception:
                          phase = "cleanup_failed"
                          raise
              phase = "complete"
          except Exception:
              pass
          finish(result, phase)
          PY
