name: Job Radar TW

on:
  schedule:
    # Start at 07:30 ET; 08:30/09:30 retry failures. Delivery waits until 09:00.
    # Keep this timezone and MONITOR_TIMEZONE below in sync when you customize the schedule.
    - cron: "30 7,8,9 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      company:
        description: "Optional company slug"
        required: false
        type: string
      run_key:
        description: "Optional idempotency key for a manual run"
        required: false
        type: string
      backfill:
        description: "Notify eligible existing matches that have not been sent"
        required: false
        default: false
        type: boolean
      suppress_notifications:
        description: "Suppress Telegram notifications and summary"
        required: false
        default: false
        type: boolean
      clinical_title_backfill:
        description: "Run the one-time clinical title backfill against stored inventory"
        required: false
        default: false
        type: boolean
      clinical_title_backfill_run_key:
        description: "Successful stored source run key to re-evaluate"
        required: false
        default: "manual-36363009458-1"
        type: string
      clinical_title_backfill_report:
        description: "Report recovered candidates from a completed backfill (read-only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: job-radar-tw-${{ github.repository }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - run: uv sync --frozen --extra llm

      - name: Provision private preferences
        id: preferences
        if: github.event_name == 'schedule' || inputs.clinical_title_backfill_report != true
        shell: bash
        env:
          PREFERENCES_YAML: ${{ secrets.PREFERENCES_YAML }}
        run: |
          if [[ -z "${PREFERENCES_YAML:-}" ]]; then
            echo "::error::PREFERENCES_YAML is required for production matching; no monitor or notifications will run."
            exit 1
          fi
          umask 077
          preferences_file="$(mktemp "${RUNNER_TEMP}/job-radar-preferences.XXXXXX")"
          printf '%s\n' "$PREFERENCES_YAML" > "$preferences_file"
          uv run python - "$preferences_file" <<'PY'
          import sys
          from pathlib import Path
          from job_monitor.config import load_preferences
          try:
              preferences = load_preferences(Path(sys.argv[1]))
              eligibility = preferences.candidate_eligibility
              if (
                  eligibility is None
                  or eligibility.residence_state is None
                  or eligibility.commuting_policy.onsite_states is None
              ):
                  raise ValueError("Explicit residence and onsite scope are required")
          except Exception:
              sys.exit("Invalid PREFERENCES_YAML; correct the private preferences secret.")
          PY
          printf '%s\n' "PREFERENCES_CONFIG=$preferences_file" >> "$GITHUB_ENV"
          printf '%s\n' 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Validate effective configuration
        run: uv run monitor validate-config --strict

      - name: Run scheduled monitor
        if: github.event_name == 'schedule' && steps.preferences.outputs.ready == 'true'
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          LLM_ENABLED: ${{ vars.LLM_ENABLED || 'false' }}
          VISA_SPONSORSHIP_REQUIRED: ${{ vars.VISA_SPONSORSHIP_REQUIRED || 'false' }}
          MONITOR_TIMEZONE: America/New_York
          MONITOR_HOUR: "7"
          # Same-day catch-up: 07:00 inclusive to 15:00 exclusive, New York time.
          SCHEDULE_GRACE_HOURS: "8"
          IMMEDIATE_NOTIFICATION_MIN_SCORE: ${{ vars.IMMEDIATE_NOTIFICATION_MIN_SCORE || '0.82' }}
          IMMEDIATE_NOTIFICATION_MAX_SOURCE_AGE_DAYS: ${{ vars.IMMEDIATE_NOTIFICATION_MAX_SOURCE_AGE_DAYS || '21' }}
          IMMEDIATE_NOTIFICATION_MAX_PER_RUN: ${{ vars.IMMEDIATE_NOTIFICATION_MAX_PER_RUN || '5' }}
          DAILY_SUMMARY_MAX_MATCHES: ${{ vars.DAILY_SUMMARY_MAX_MATCHES || '15' }}
        run: |
          if [[ -n "${RESUME_TEXT:-}" ]]; then
            resume_file="${RUNNER_TEMP}/resume.md"
            printf '%s' "$RESUME_TEXT" > "$resume_file"
            export RESUME_PATH="$resume_file"
            unset RESUME_TEXT
          fi
          timeout --signal=INT --kill-after=30s 110m uv run monitor run --scheduled --status-file "${RUNNER_TEMP}/job-radar-scan-status.json"

      - name: Summarize scheduled scan outcome
        if: always() && github.event_name == 'schedule'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "job-radar-scan-status.json"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Scheduled scan outcome\n\n")
              if path.exists():
                  status = json.loads(path.read_text(encoding="utf-8"))
                  summary.write("```json\n" + json.dumps(status, indent=2) + "\n```\n")
              else:
                  summary.write("Scan outcome: unknown. No status report was produced; "
                                "do not interpret workflow status as a completed scan.\n")
          PY

      - name: Run manual monitor
        if: github.event_name == 'workflow_dispatch' && inputs.clinical_title_backfill != true && inputs.clinical_title_backfill_report != true && steps.preferences.outputs.ready == 'true'
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          LLM_ENABLED: ${{ vars.LLM_ENABLED || 'false' }}
          VISA_SPONSORSHIP_REQUIRED: ${{ vars.VISA_SPONSORSHIP_REQUIRED || 'false' }}
          MONITOR_TIMEZONE: America/New_York
          MONITOR_HOUR: "7"
          SCHEDULE_GRACE_HOURS: "4"
          IMMEDIATE_NOTIFICATION_MIN_SCORE: ${{ vars.IMMEDIATE_NOTIFICATION_MIN_SCORE || '0.82' }}
          IMMEDIATE_NOTIFICATION_MAX_SOURCE_AGE_DAYS: ${{ vars.IMMEDIATE_NOTIFICATION_MAX_SOURCE_AGE_DAYS || '21' }}
          IMMEDIATE_NOTIFICATION_MAX_PER_RUN: ${{ vars.IMMEDIATE_NOTIFICATION_MAX_PER_RUN || '5' }}
          DAILY_SUMMARY_MAX_MATCHES: ${{ vars.DAILY_SUMMARY_MAX_MATCHES || '15' }}
          INPUT_COMPANY: ${{ inputs.company }}
          INPUT_RUN_KEY: ${{ inputs.run_key }}
          INPUT_BACKFILL: ${{ inputs.backfill }}
          INPUT_SUPPRESS_NOTIFICATIONS: ${{ inputs.suppress_notifications }}
        run: |
          if [[ -n "${RESUME_TEXT:-}" ]]; then
            resume_file="${RUNNER_TEMP}/resume.md"
            printf '%s' "$RESUME_TEXT" > "$resume_file"
            export RESUME_PATH="$resume_file"
            unset RESUME_TEXT
          fi
          args=()
          if [[ -n "$INPUT_COMPANY" ]]; then
            args+=(--company "$INPUT_COMPANY")
          fi
          if [[ -n "$INPUT_RUN_KEY" ]]; then
            args+=(--run-key "$INPUT_RUN_KEY")
          else
            args+=(--run-key "manual-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          fi
          if [[ "$INPUT_BACKFILL" == "true" ]]; then
            args+=(--backfill)
          fi
          if [[ "$INPUT_SUPPRESS_NOTIFICATIONS" == "true" ]]; then
            args+=(--suppress-notifications)
          fi
          timeout --signal=INT --kill-after=30s 45m uv run monitor run "${args[@]}"

      - name: Run one-time clinical title backfill
        if: github.event_name == 'workflow_dispatch' && inputs.clinical_title_backfill == true && inputs.clinical_title_backfill_report != true && steps.preferences.outputs.ready == 'true'
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          LLM_ENABLED: ${{ vars.LLM_ENABLED || 'false' }}
          VISA_SPONSORSHIP_REQUIRED: ${{ vars.VISA_SPONSORSHIP_REQUIRED || 'false' }}
          MONITOR_TIMEZONE: America/New_York
          INPUT_BACKFILL_RUN_KEY: ${{ inputs.clinical_title_backfill_run_key }}
        run: |
          if [[ -n "${RESUME_TEXT:-}" ]]; then
            resume_file="${RUNNER_TEMP}/resume.md"
            printf '%s' "$RESUME_TEXT" > "$resume_file"
            export RESUME_PATH="$resume_file"
            unset RESUME_TEXT
          fi
          uv run monitor clinical-title-backfill --target-run-key "$INPUT_BACKFILL_RUN_KEY"

      - name: Report completed clinical title backfill
        if: github.event_name == 'workflow_dispatch' && inputs.clinical_title_backfill_report == true
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INPUT_BACKFILL_RUN_KEY: ${{ inputs.clinical_title_backfill_run_key }}
        run: uv run monitor clinical-title-backfill-report --target-run-key "$INPUT_BACKFILL_RUN_KEY"

      - name: Notify Telegram on workflow failure
        if: failure() && steps.preferences.outputs.ready == 'true' && inputs.suppress_notifications != true && inputs.clinical_title_backfill_report != true
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [[ -z "${TELEGRAM_BOT_TOKEN}" || -z "${TELEGRAM_CHAT_ID}" ]]; then
            echo "Telegram secrets not configured; skipping failure notification."
            exit 0
          fi
          text=$'🚨 Job Radar TW GitHub Actions failed\n'
          text+="Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail --silent --show-error -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            --data-urlencode "disable_web_page_preview=true"
